name: Test Assets
permissions:
  contents: read
on:
  pull_request:
    types: [opened,synchronize]
    branches-ignore:
      - testing
  workflow_dispatch: {}

jobs:
  build_strategy_matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Get the current branch name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        id: myref

      - uses: actions/checkout@v3
      - name: Set up Python for matrix generation
        uses: actions/setup-python@v4
        with:
          python-version: 3.10.17
      - name: Install dependencies for matrix generation
        run: |
          pip install pyyaml packaging
      - id: set-matrix
        # Build matrix grouped by Python version using the generate_ci_matrix.py script
        run: | 
          echo "base ref: ${{ github.base_ref }}"
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
          base_ref="origin/${{ github.base_ref }}"
      
          echo "Diffing against $base_ref:"
          changed_files="$(git diff "$base_ref" --name-only || true)"
          
          # Collect candidate package paths from diff
          candidates=$(
            printf '%s\n' "$changed_files" \
            | awk -F'/' '
                /^functions\/src\// {print $1"/"$2"/"$3}
                /^modules\/src\//  {print $1"/"$2"/"$3}
                /^steps\/src\//  {print $1"/"$2"/"$3}
              ' \
            | sort -u
          )
          
          # Keep only those that are actual directories
          packages=""
          for dir in $candidates; do
            if [[ -d "$dir" ]]; then
              packages+="$dir"$'\n'
            fi
          done
          
          if [[ -z "$packages" ]]; then
            matrix_json='{"include":[]}'
          else
            # Use the generate_ci_matrix.py script to create matrix grouped by Python version
            matrix_json=$(printf '%s' "$packages" | python3 cli/utils/generate_ci_matrix.py)
          fi
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  check_matrix:
    runs-on: ubuntu-latest
    needs: build_strategy_matrix
    steps:
      - name: Install json2yaml
        run: |
          sudo npm install -g json2yaml
      - name: Check matrix definition
        run: |
          matrix='${{ needs.build_strategy_matrix.outputs.matrix }}'
          echo $matrix
          echo $matrix | jq .
          echo $matrix | json2yaml

  run_monorepo_tests:
    needs: build_strategy_matrix
    if: needs.build_strategy_matrix.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      # matrix: [{"python-version": "3.9", "packages": [...]}, {"python-version": "3.11", "packages": [...]}]
      matrix: ${{fromJson(needs.build_strategy_matrix.outputs.matrix)}}
    steps:
     - name: Checkout current repo
       uses: actions/checkout@v3
     # Install python based on matrix
     - name: Install python ${{ matrix.python-version }}
       uses: actions/setup-python@v4
       with:
         python-version: ${{ matrix.python-version }}
     # Install dependencies
     - uses: actions/cache@v3
       id: cache
       with:
         path: ~/.cache/pip
         key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
         restore-keys: |
           ${{ runner.os }}-pip-
     - name: Install requirements
       run: |
         pip install --upgrade pip
         pip install -r requirements.txt
     - name: Print workspace structure
       run: |
         echo "Current directory: $(pwd)"
         echo "Python version: $(python --version)"
         echo "Packages to test: ${{ join(matrix.packages, ', ') }}"
     - name: Run py tests for all packages
       run: |
         echo "Testing packages with Python ${{ matrix.python-version }}"
         for package in ${{ join(matrix.packages, ' ') }}; do
           echo "=========================================="
           echo "Testing: $package"
           echo "=========================================="
           python -m cli.cli run-tests -r "$package" -s py -fn $(basename "$package") --python-version ${{ matrix.python-version }}
         done
